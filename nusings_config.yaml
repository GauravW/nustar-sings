nustar-data-dir: "/disk/bifrost/nustar/fltops/"

sings-paths:
  main-dir: "/disk/bifrost/gaurav/sings"
  essential-data-path: "/disk/bifrost/gaurav/sings/config_data/"
  gcn-db-path: "/disk/bifrost/gaurav/sings/sings-products/gcn-notices-sings.db"
  notice-archive-dir: "/disk/bifrost/gaurav/sings/sings-products/notices/"
  notices-log: "/disk/bifrost/gaurav/sings/sings-products/notices/notice-log.txt"
  ts-queue-db: "/disk/bifrost/gaurav/sings/sings-products/ts-queue.db"
  ts-products-dir: "/disk/bifrost/gaurav/sings/sings-products/ts-products/"

slack:
  slack-ts-reports: "sings-ts-reports"
  slack-ts-reports-id: "C0AFBGF5XRQ"
  slack-ts-reports-status: 0 # 0: off, 1: on
  slack-ts-notices: "sings-ts-notices"
  slack-ts-notices-id: "C0AEW3T775M"
  slack-ts-notices-status: 1 # 0: off, 1: on
  slack_bs_reports_status: 1   # new-candidate alerts
  slack_bs_reports_id: "C0C6WHVUKNJ"
  slack_bs_log_status: 1
  slack_bs_log_id: "C0C6T7V8DKP"

ts-config:
  ts-back-search: 2 # days to look back for TS products
  interval: 3600 # seconds between checks for new notices in the queue

bs_paths:
  bs_db: "/disk/bifrost/gaurav/sings/sings-products/bs_candidates.db"
  bs_products_dir: "/disk/bifrost/gaurav/sings/sings-products/bs-products/"
  obs_dir: "obs-products"
  cand_dir: "bs-candidates"

bs_config:
  interval: 1800            # s between queue passes
  back_search_days: 3      # seqs scheduled in this lookback are checked for new data
  hk_min_new_rows: 100      # HK rows added since last run -> full rerun of the seq
  evt_min_new_rows: 100     # event rows added (HK unchanged) -> reports-only rerun
  group_gap_s: 100          # t0_new - t1_prev <= this -> same candidate
  ts_match_s: 100           # NUTS within this of a candidate span -> nu_bs_ts_match
  saa_polygon: [[260, -6.25], [350, -6.25], [330, 2.0], [310, 2.0], [260, -6.25]]
  max_gap_s: 30             # HK time gap that splits a window (data gaps, not SAA)
  min_bins: 100
  w_base: 300               # running-median detrending window size (s)
  algos: ["mf", "bb"]
  mf:
    timescales: [4, 16, 64, 128, 256]
    thresh: 5.0
    floor: 8
    nmin: 4
    edge_pad: 64
    merge_gap: 20
  bb:
    bb_downsample: 4
    p0: 0.05                
    block_thresh: 6
    floor: 4
    nmin: 5
    center: true
    min_bb_bins: 32
    edge_pad: 64
    merge_gap: 20
  saa_reject:
    near_deg: 5        # candidate ground track within this many degrees of the SAA polygon.
    min_dur_s: 100      # candidate span at least this long -> status saa_reject (no alerts)
    reports: false      # run make_grb_report for rejected candidates too